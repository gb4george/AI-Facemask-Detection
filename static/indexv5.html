<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mask Detection System</title>
    <style>
        /* Black Background Theme */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        .left-column {
            flex: 1.5;
            padding: 20px;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .right-column {
            flex: 1;
            padding: 20px;
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
        }

        h2 { color: #00ff88; margin-bottom: 20px; }

        .comparison-view {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .img-box {
            flex: 1;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        img { max-width: 100%; border-radius: 4px; display: none; }

        input, button {
            background: #222; color: #fff; border: 1px solid #444;
            padding: 12px; border-radius: 6px; width: 100%; margin-top: 10px;
        }

        button { background: #00ff88; color: #000; font-weight: bold; cursor: pointer; }
        
        #chatOutput {
            flex-grow: 1;
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 10px;
            overflow-y: auto;
            border-radius: 5px;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="left-column">
        <h2>🎯 Image Detection</h2>
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="runInference()">Run YOLO Inference</button>

        <div class="comparison-view">
            <div class="img-box">
                <p style="font-size: 0.8rem; color: #888;">ORIGINAL</p>
                <img id="originalImg" src="" alt="Original">
            </div>
            <div class="img-box">
                <p style="font-size: 0.8rem; color: #888;">DETECTION</p>
                <img id="detectedImg" src="" alt="Detected">
            </div>
        </div>
    </div>

    <div class="right-column">
        <h2>🤖 AI Assistant</h2>
        <div id="chatOutput">Ask about the project documentation...</div>
        <input type="text" id="userInput" placeholder="Ask a question...">
        <button onclick="sendQuery()">Ask AI</button>
    </div>

    <script>
        async function runInference() {
            const fileInput = document.getElementById('imageInput');
            
            // FIX: Check if files exist and use index 
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Please select an image first.");
                return;
            }

            const originalImg = document.getElementById('originalImg');
            const detectedImg = document.getElementById('detectedImg');

            // FIX: Create URL for the SPECIFIC file object at index 0
            originalImg.src = URL.createObjectURL(fileInput.files);
            originalImg.style.display = 'block';

            // Prepare Data for FastAPI /detect [Source 20]
            const formData = new FormData();
            formData.append('file', fileInput.files);
            formData.append('conf', 0.5);

            try {
                const response = await fetch('/detect', { method: 'POST', body: formData });
                const data = await response.json();
                
                // Assuming backend returns base64 or a URL string
                detectedImg.src = data.image_base64 || data.processed_image_url;
                detectedImg.style.display = 'block';
            } catch (err) {
                console.error("Detection Error:", err);
            }
        }

        async function sendQuery() {
            const query = document.getElementById('userInput').value;
            const output = document.getElementById('chatOutput');
            
            const formData = new FormData();
            formData.append('question', query);

            try {
                const response = await fetch('/chat', { method: 'POST', body: formData });
                const result = await response.json();
                output.innerHTML += `<div style="margin-bottom:10px;"><b>You:</b> ${query}<br><span style="color:#00ff88"><b>AI:</b> ${result.answer}</span></div>`;
            } catch (err) {
                output.innerHTML += `<div style="color:red">Error connecting to AI Assistant.</div>`;
            }
        }
    </script>
</body>
</html>
