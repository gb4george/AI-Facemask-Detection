<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mask Detection System</title>
    <style>
        /* UI Foundation: Black Background Theme */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Side-by-Side Column Layout */
        .left-column {
            flex: 3; /* Larger space for visual detection */
            padding: 30px;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .right-column {
            flex: 2; /* Focused space for chat interaction */
            padding: 30px;
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
        }

        h2 { color: #00ff88; display: flex; align-items: center; gap: 10px; }

        /* Comparison Container */
        .comparison-view {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-grow: 1;
        }

        .img-container {
            flex: 1;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        img { max-width: 100%; max-height: 400px; border-radius: 4px; }

        /* Chat UI Components */
        #chatOutput {
            flex-grow: 1;
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 10px;
            overflow-y: auto;
            border-radius: 5px;
            font-size: 0.95rem;
            color: #ccc;
        }

        input, button {
            background: #222; color: #fff; border: 1px solid #444;
            padding: 12px; border-radius: 6px; width: 100%; margin-top: 10px;
        }

        button { background: #00ff88; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #00cc6e; }
    </style>
</head>
<body>

    <!-- LEFT COLUMN: 🎯 IMAGE DETECTION -->
    <div class="left-column">
        <h2>🎯 Image Detection</h2>
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="runInference()">Run YOLO Inference</button>

        <div class="comparison-view">
            <div class="img-container">
                <p>Original Image</p>
                <img id="originalImg" src="" alt="Pending Upload...">
            </div>
            <div class="img-container">
                <p>Detected Output</p>
                <img id="detectedImg" src="" alt="Waiting for YOLO...">
            </div>
        </div>
    </div>

    <!-- RIGHT COLUMN: 🤖 AI CHAT -->
    <div class="right-column">
        <h2>🤖 AI Assistant</h2>
        <div id="chatOutput">Ready to help with mask protocols...</div>
        <input type="text" id="userInput" placeholder="Ask about the project document...">
        <button onclick="sendQuery()">Ask AI</button>
    </div>

    <script>
        // Connecting to the /detect endpoint [Source 20]
        async function runInference() {
            const fileInput = document.getElementById('imageInput');
            if (!fileInput.files) return alert("Select an image first!");

            // Display Original
            document.getElementById('originalImg').src = URL.createObjectURL(fileInput.files);

            // Prepare Data for FastAPI
            const formData = new FormData();
            formData.append('file', fileInput.files);
            formData.append('conf', 0.5); // Default confidence
            formData.append('iou', 0.45);

            const response = await fetch('/detect', { method: 'POST', body: formData });
            const data = await response.json();
            
            // Note: Update 'detectedImg' based on your /detect return type (Base64 or URL)
            document.getElementById('detectedImg').src = data.processed_image_url || data.image_base64;
        }

        // Connecting to the /chat endpoint [Source 21]
        async function sendQuery() {
            const query = document.getElementById('userInput').value;
            const output = document.getElementById('chatOutput');
            
            const formData = new FormData();
            formData.append('question', query);

            const response = await fetch('/chat', { method: 'POST', body: formData });
            const result = await response.json();
            output.innerHTML += `<div><b>You:</b> ${query}</div>`;
            output.innerHTML += `<div style="color:#00ff88"><b>AI:</b> ${result.answer}</div><hr style="border-color:#222">`;
            document.getElementById('userInput').value = '';
        }
    </script>
</body>
</html>
