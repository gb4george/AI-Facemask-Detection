<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Face Mask Detection + AI Chat (FastAPI)</title>
  <style>
    body { font-family: sans-serif; display: flex; gap: 20px; }
    .column { flex: 1; border: 1px solid #ccc; padding: 10px; }
    .output-box { white-space: pre-wrap; background: #f9f9f9; padding: 8px; }
  </style>
</head>
<body>
  <!-- LEFT: Detection -->
  <div class="column">
    <h2>Image Detection</h2>
    <p>Upload a frame or image; backend will run YOLO and return detections.</p>
    <input type="file" id="imageInput" accept="image/*"><br><br>
    <label>Conf: <input type="number" id="conf" value="0.5" step="0.05" min="0.1" max="0.9"></label><br>
    <label>IOU: <input type="number" id="iou" value="0.45" step="0.05" min="0.3" max="0.7"></label><br>
    <label><input type="checkbox" id="enhance" checked> Enhance low-light (CLAHE)</label><br><br>
    <button onclick="sendDetect()">Run Detection</button>
    <h3>Detections</h3>
    <div id="detectOutput" class="output-box"></div>
  </div>

  <!-- RIGHT: Chat -->
  <div class="column">
    <h2>Project AI Chat</h2>
    <p>Ask questions about the Face Mask Detection project.</p>
    <textarea id="question" rows="4" cols="40"
      placeholder="Ask a technical question..."></textarea><br><br>
    <button onclick="sendChat()">Ask</button>
    <h3>Answer</h3>
    <div id="chatOutput" class="output-box"></div>
  </div>

  <script>
    async function sendDetect() {
      const fileInput = document.getElementById("imageInput");
      if (!fileInput.files[0]) {
        alert("Please select an image first.");
        return;
      }

      const conf = document.getElementById("conf").value;
      const iou = document.getElementById("iou").value;
      const enhance = document.getElementById("enhance").checked;

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("conf", conf);
      formData.append("iou", iou);
      formData.append("enhance", enhance);

      const resp = await fetch("http://localhost:8000/detect", {
        method: "POST",
        body: formData
      });

      const data = await resp.json();
      document.getElementById("detectOutput").textContent =
        JSON.stringify(data, null, 2);
    }

    async function sendChat() {
      const question = document.getElementById("question").value.trim();
      if (!question) {
        alert("Please type a question.");
        return;
      }

      const formData = new FormData();
      formData.append("question", question);

      const resp = await fetch("http://localhost:8000/chat", {
        method: "POST",
        body: formData
      });

      const data = await resp.json();
      document.getElementById("chatOutput").textContent = data.answer;
    }
  </script>
</body>
</html>
